include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

font_family JetBrainsMono Nerd Font
font_size 6

window_padding_width 10

confirm_os_window_close 0
enable_audio_bell no

cursor_shape block
cursor_blink_interval 0

foreground #d8dee9
background #0b1220

selection_foreground #ffffff
selection_background #3b4252

active_border_color #89b4fa
inactive_border_color #45475a

tab_bar_style hidden
shell zsh --login -c "neofetch; zsh"
background_opacity 0.5
